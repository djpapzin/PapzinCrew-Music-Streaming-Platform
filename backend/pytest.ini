# File Description: Pytest configuration for backend tests
# Author: DJ Papzin
# Created: 2025

[pytest]
markers =
    integration: marks tests as integration (deselect with "-m 'not integration'")
    asyncio: mark tests that use asyncio
addopts = -ra -p asyncio -p no:langsmith
# Limit default discovery to backend tests
testpaths = tests
asyncio_mode = auto
 

# Treat deprecations as errors to keep the codebase modern and warning-free.
filterwarnings =
    error::DeprecationWarning
    error::FutureWarning
    # Example: ignore specific noisy libs until upgraded
    ignore::DeprecationWarning:aiohttp\.
    ignore:'crypt' is deprecated and slated for removal in Python 3.13:DeprecationWarning
    ignore:on_event is deprecated, use lifespan event handlers instead\.:DeprecationWarning
    # Starlette 0.37's test client uses this alias; remove when Starlette is upgraded.
    ignore:The anyio\.abc\.BlockingPortal alias is deprecated.*:DeprecationWarning:starlette\.testclient
