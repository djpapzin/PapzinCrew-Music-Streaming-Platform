[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  VITE_UPLOAD_URL = "https://audio.djpapzin.com/intake/upload"

# Proxy API requests to the live backend so the browser stays same-origin on Netlify.
[[redirects]]
  from = "/api/*"
  to = "https://papzincrew-api.djpapzin.com/:splat"
  status = 200
  force = true

# Keep old API clients working; redirect public pages to the primary domain.
[[redirects]]
  from = "https://papzincrew.netlify.app/*"
  to = "https://crew.djpapzin.com/:splat"
  status = 301
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
